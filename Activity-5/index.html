<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking - Activity 5</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>IPL Ticket Booking</h1>
        <p>Experience the stadium energy live!</p>
    </header>


    <!-- Match Schedule -->
    <section class="matches">

        <h2>Upcoming Matches</h2>

        <div class="match-card">
            <h3>Royal Challengers Bengaluru vs Chennai Super Kings</h3>

            <p>Date: 25 November 2026</p>
            <p>Venue: Bengaluru</p>

            <button class="book-btn">Book Ticket</button>
        </div>

        <div class="match-card">
            <h3>Mumbai Indians vs Kolkata Knight Riders</h3>

            <p>Date: 27 November 2026</p>
            <p>Venue: Mumbai</p>

            <button class="book-btn">Book Ticket</button>
        </div>

    </section>


    <!-- Booking Form -->
    <section id="booking">

        <h2>Book Your Ticket</h2>

        <form id="bookingForm">

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="match">Select Match:</label>

            <select id="match" required>
                <option value="">Choose a match</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
            </select>

            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" min="1" max="10" required>

            <button type="submit">Confirm Booking</button>

        </form>

        <!-- Booking Information -->
        <div id="bookingDetails"></div>

    </section>


    <!-- Footer -->
    <footer>
        <p>IPL Ticket Booking | Activity 5</p>
    </footer>


    <!-- JavaScript File -->
    <script src="app.js"></script>

</body>
</html>
