<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book IPL Tickets</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">IPL TICKETS</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
        </div>
    </nav>

    <!-- Booking Form -->
    <div class="booking-container">

        <h1>IPL Ticket Booking</h1>

        <p>Enter your details to book your favourite IPL match.</p>

        <form action="#" method="get">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    minlength="3"
                    maxlength="50"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    title="Please enter exactly 10 digits"
                    required>
            </div>

            <!-- Match Selection -->
            <div class="form-group">
                <label for="match">Select Match</label>

                <select id="match" name="match" required>
                    <option value="">-- Choose a Match --</option>
                    <option value="CSK vs MI">CSK vs MI</option>
                    <option value="RCB vs KKR">RCB vs KKR</option>
                    <option value="MI vs SRH">MI vs SRH</option>
                    <option value="KKR vs CSK">KKR vs CSK</option>
                    <option value="RCB vs CSK">RCB vs CSK</option>
                </select>
            </div>

            <!-- Stand Category -->
            <div class="form-group">
                <label for="stand">Stand Category</label>

                <select id="stand" name="stand" required>
                    <option value="">-- Choose a Stand --</option>
                    <option value="General">General Stand</option>
                    <option value="Premium">Premium Stand</option>
                    <option value="VIP">VIP Stand</option>
                    <option value="Corporate">Corporate Box</option>
                </select>
            </div>

            <!-- Number of Tickets -->
            <div class="form-group">
                <label for="tickets">Number of Tickets</label>

                <input
                    type="number"
                    id="tickets"
                    name="tickets"
                    min="1"
                    max="10"
                    value="1"
                    required>
            </div>

            <!-- Additional Preference -->
            <div class="form-group">
                <label>Additional Preference</label>

                <div class="radio-group">
                    <label>
                        <input
                            type="radio"
                            name="preference"
                            value="Near Boundary">
                        Near Boundary
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="preference"
                            value="Near Pavilion">
                        Near Pavilion
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="preference"
                            value="No Preference"
                            checked>
                        No Preference
                    </label>
                </div>
            </div>

            <!-- Submit and Reset -->
            <div class="button-group">

                <button type="submit" class="submit-btn">
                    Submit Booking
                </button>

                <button type="reset" class="reset-btn">
                    Reset Form
                </button>

            </div>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
